[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=fastapi_route
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning
    ignore:.*importlib_metadata.*:DeprecationWarning
    ignore:.*cryptography.*:DeprecationWarning
    ignore:.*urllib3.*:DeprecationWarning
    ignore:.*The 'asyncio_mode' default value.*:DeprecationWarning
    ignore:.*coroutine 'Request.json' was never awaited.*:RuntimeWarning
    ignore:.*coroutine 'Request.body' was never awaited.*:RuntimeWarning